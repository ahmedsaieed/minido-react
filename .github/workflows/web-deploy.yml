name: Web deploy

# Builds the static web bundle and publishes it to Cloudflare Pages
# (project "minido", production branch "master").
#
# Repo secrets required:
#   CLOUDFLARE_API_TOKEN              — token with "Cloudflare Pages: Edit" only
#   CLOUDFLARE_ACCOUNT_ID
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_SECRET — inlined into the bundle (see
#                                          Phase 5C in minido-requirements.md)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx jest

      - name: Export web bundle
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_SECRET }}

      - name: Check headers file made it into the bundle
        run: test -f dist/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=minido --branch=master
